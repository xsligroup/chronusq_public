name: CQ CI - CMake Configure, Build, Test

on:
  push:
    branches: dev
  pull_request:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "GCC",
            os: [self-hosted, gcc],
            # cc: "gcc-12",
            # cxx: "g++-12",
            # fc: "gfortran-12",
            enable_mpi: OFF,
            additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
            parallel_build_tasks: 1
          }
          - {
            name: "GCC-MPI",
            os: [self-hosted, gcc, mpi],
            # cc: "gcc-12",
            # cxx: "g++-12",
            # fc: "gfortran-12",
            enable_mpi: On,
            additional_cmake_args: -DCQ_ENABLE_MPI=ON,
            parallel_build_tasks: 1
          }
          # - {
          #   name: "Intel",
          #   os: [self-hosted, intel],
          #   cc: "icx",
          #   cxx: "icpx",
          #   fc: "ifx",
          #   additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
          #   parallel_build_tasks: 4
          # }
          # - {
          #   name: "Intel-MPI",
          #   os: [self-hosted, intel, mpi],
          #   cc: "icx",
          #   cxx: "icpx",
          #   fc: "ifx",
          #   additional_cmake_args: -DCQ_ENABLE_MPI=ON,
          #   parallel_build_tasks: 4
          # }
    steps:
      - name: Checkout Current CQ Branch
        uses: actions/checkout@v3
      - name: Set up environment
        run: |
          env
          mkdir build
      - name: Configure
        shell: bash
        working-directory: build
        run: |
          source scl_source enable gcc-toolset-13
          cmake \
            -DCQ_ENABLE_MPI=${{ matrix.config.enable_mpi }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COLOR_DIAGNOSTICS=On \
            -G Ninja \
            -S .. -B .
            # -DCMAKE_C_COMPILER=${{ matrix.config.cc }}  \
            # -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            # -DCMAKE_Fortran_COMPILER=${{ matrix.config.fc }} \
      - name: Build
        shell: bash
        working-directory: build
        run: |
          cmake --build . \
                --config Release \
                --parallel ${{ matrix.config.parallel_build_tasks }}
      - name: Test
        shell: bash
        working-directory: build
        run: |
          ctest . \
                --output-on-failure \
                --parallel ${{ matrix.config.parallel_build_tasks }}
