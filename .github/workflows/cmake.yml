name: CQ CI - CMake Configure, Build, Test

on:
  push:
    branches: dev
  pull_request:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "GCC10_NoMPI_Release",
            os: self-hosted,
            build_type: "Release",
            opt_lvl: "-O3",
            compiler_path_sh: "/home/ci_software/gcc-10.2.0.sh",
            libint_root: "/sw/libint/2/7/0/beta.6/gcc/10/2/0",
            additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
            parallel_build_tasks: 4
          }
          #- {
          #  name: "Intel21_NoMPI_Release",
          #  os: self-hosted,
          #  build_type: "Release",
          #  opt_lvl: "-O3",
          #  compiler_path_sh: "/home/ci_software/intel-21.1.1.sh",
          #  libint_root: "/sw/libint/2/7/0/beta.6/intel/21/1/1",
          #  additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
          #  parallel_build_tasks: 4
          #}
          - {
            name: "IntelOneAPI_NoMPI_Release",
            os: self-hosted,
            build_type: "Release",
            opt_lvl: "-O3",
            compiler_path_sh: "/home/ci_software/intel-oneapi.sh",
            libint_root: "/sw/libint/2/7/0/beta.6/intel/oneapi",
            additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
            parallel_build_tasks: 4
          }
          - {
            name: "GCC10_MPICH_Release",
            os: self-hosted,
            build_type: "Release",
            opt_lvl: "-O3",
            compiler_path_sh: "/home/ci_software/gcc-10.2.0_mpich-3.2.1.sh",
            libint_root: "/sw/libint/2/7/0/beta.6/gcc/10/2/0",
            additional_cmake_args: -DCQ_ENABLE_MPI=ON  -DCQ_SCALAPACK_LIBRARIES="$SCALAPACK_LIBRARY_DIR/libscalapack.a" -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx,
            parallel_build_tasks: 4
          }
    steps:
      - name: Checkout Current CQ Branch
        uses: actions/checkout@v3
      - name: Set up environment
        run: |
          source ${{ matrix.config.compiler_path_sh }}
          env
          mkdir build
      - name: Configure
        shell: bash
        working-directory: build
        run: |
          source ${{ matrix.config.compiler_path_sh }}
          cmake \
            -DLibint2_ROOT=${{ matrix.config.libint_root }} \
            -DCMAKE_CXX_FLAGS=${{ matrix.config.opt_lvl }} \
            -DCMAKE_C_FLAGS=${{ matrix.config.opt_lvl }}  \
            -DCMAKE_Fortran_FLAGS=${{ matrix.config.opt_lvl }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            ${{ matrix.config.additional_cmake_args }} \
            ..
      - name: Build
        shell: bash
        working-directory: build
        run: |
          source ${{ matrix.config.compiler_path_sh }}
          cmake --build .
      - name: Test
        shell: bash
        working-directory: build
        run: |
          source ${{ matrix.config.compiler_path_sh }}
          ctest --output-on-failure
