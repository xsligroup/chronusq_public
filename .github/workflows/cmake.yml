name: CQ CI - CMake Configure, Build, Test

on:
  push:
    # branches: dev
  pull_request:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "GCC12-Release",
            os: [self-hosted, gcc12],
            build_type: "Release",
            cc: "gcc-12",
            cxx: "g++-12",
            fc: "gfortran-12",
            additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
            parallel_build_tasks: 8
          }
          # - {
          #   name: "GCC12-MPI-Release",
          #   os: [self-hosted, gcc12, mpich],
          #   build_type: "Release",
          #   cc: "gcc-12",
          #   cxx: "g++-12",
          #   fc: "gfortran-12",
          #   additional_cmake_args: -DMPI_C_COMPILER=mpicc -DMPI_CXX_COMPILER=mpicxx -DCQ_ENABLE_MPI=ON,
          #   parallel_build_tasks: 4
          # }
    steps:
      - name: Checkout Current CQ Branch
        uses: actions/checkout@v3
      - name: Set up environment
        run: |
          env
          mkdir build
      - name: Configure
        shell: bash
        working-directory: build
        run: |
          cmake \
            -DCMAKE_C_COMPILER=${{ matrix.config.cc }}  \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.config.fc }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            ${{ matrix.config.additional_cmake_args }} \
            ..
      - name: Build
        shell: bash
        working-directory: build
        run: |
          # source ${{ matrix.config.compiler_path_sh }}
          cmake --build . --parallel ${{ matrix.config.parallel_build_tasks }}
      - name: Test
        shell: bash
        working-directory: build
        run: |
          # source ${{ matrix.config.compiler_path_sh }}
          ctest --output-on-failure --parallel ${{ matrix.config.parallel_build_tasks }}
