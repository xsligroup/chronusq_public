name: CQ CI - CMake Configure, Build, Test

on:
  push:
    branches: dev
  pull_request:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "GCC12",
            os: [self-hosted, gcc12],
            cc: "gcc-12",
            cxx: "g++-12",
            fc: "gfortran-12",
            additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
            parallel_build_tasks: 4
          }
          - {
            name: "GCC12-MPI",
            os: [self-hosted, gcc12, mpi],
            cc: "gcc-12",
            cxx: "g++-12",
            fc: "gfortran-12",
            additional_cmake_args: -DCQ_ENABLE_MPI=ON,
            parallel_build_tasks: 4
          }
          - {
            name: "Intel",
            os: [self-hosted, intel],
            cc: "icx",
            cxx: "icpx",
            fc: "ifx",
            additional_cmake_args: -DCQ_ENABLE_MPI=OFF,
            parallel_build_tasks: 4
          }
          - {
            name: "Intel-MPI",
            os: [self-hosted, intel, mpi],
            cc: "icx",
            cxx: "icpx",
            fc: "ifx",
            additional_cmake_args: -DCQ_ENABLE_MPI=ON,
            parallel_build_tasks: 4
          }
    steps:
      - name: Checkout Current CQ Branch
        uses: actions/checkout@v3
      - name: Set up environment
        run: |
          env
          mkdir build
      - name: Configure
        shell: bash
        working-directory: build
        run: |
          cmake \
            -DCMAKE_C_COMPILER=${{ matrix.config.cc }}  \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.config.fc }} \
            ${{ matrix.config.additional_cmake_args }} \
            ..
      - name: Build
        shell: bash
        working-directory: build
        run: |
          cmake --build . \
                --config Release \
                --parallel ${{ matrix.config.parallel_build_tasks }}
      - name: Test
        shell: bash
        working-directory: build
        run: |
          ctest . \
                --output-on-failure \
                --parallel ${{ matrix.config.parallel_build_tasks }}
